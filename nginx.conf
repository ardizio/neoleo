server {
    listen 80;
    root /usr/share/nginx/html;

    sendfile on;
    tcp_nopush on;
    open_file_cache max=1000 inactive=60s;

    # Precompressed .gz from build; on-the-fly fallback for anything else.
    gzip_static on;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_vary on;

    # Hashed filenames -> safe to cache forever (browser + Cloudflare edge).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # App requests catalog.json?v=<content hash>, so a new snapshot = new URL -> cache forever.
    location /data/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
