services:
  web:
    build: .
    ports: ["127.0.0.1:${PORT:-8095}:80"]
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [web]
    restart: unless-stopped
